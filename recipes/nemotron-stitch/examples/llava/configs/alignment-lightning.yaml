# Stage 1 — alignment on the Lightning 30B target, upstream-main track
# (NeMo RL main + AutoModel r0.6.0). Same stage as alignment.yaml with the
# LIGHTNING_30B spec's values and native AutoModel implementation.
# One rank (EP defaults to 8 below, so single-GPU runs override it):
#   python -m nemo_automodel.cli.app configs/alignment-lightning.yaml --nproc-per-node 1 \
#     --distributed.ep_size=1
# Eight ranks (8×H100 80 GB, expert-parallel; qualified 2026-09-03):
#   torchrun --nproc-per-node 8 -m nemo_automodel.cli.app configs/alignment-lightning.yaml
# EP=8 is the default 8×H100 topology: it shards the 128 routed experts
# (16/rank) and FSDP2 shards the rest (~13.6 GiB/rank vs ~75 GiB
# single-GPU), and it removes the expert weights from the per-microbatch
# FSDP2 all-gather.
# Batch geometry: the packed microbatch is 1, so global batch 16 yields 2
# accumulation steps at 8 ranks (the qualified 2026-09-03 geometry); pass
# --step_scheduler.global_batch_size=8 for the accumulation-free 8-rank
# geometry. Multi-pack microbatches are unsupported by the packed collator.
recipe: nemotron_stitch.automodel.recipe.ProjectorFinetuneRecipe

step_scheduler:
  global_batch_size: 16
  # One microbatch item is one padding-free pack containing as many source
  # samples as fit under packed_sequence.packed_sequence_size.
  local_batch_size: 1
  num_epochs: 1000
  max_steps: 100
  ckpt_every_steps: 1000
  val_every_steps: 1000

dist_env:
  backend: nccl
  timeout_minutes: 30

rng:
  _target_: nemo_automodel.components.training.rng.StatefulRNG
  seed: 42
  ranked: true

model:
  _target_: nemo_automodel.NeMoAutoModelForCausalLM.from_pretrained
  pretrained_model_name_or_path: &model-path artifacts/models/lightning-30b-bf16
  local_files_only: true
  trust_remote_code: false
  torch_dtype: torch.bfloat16
  architectures: [LlavaExampleNemotronLightningForCausalLM]
  backend:
    _target_: nemo_automodel.components.models.common.BackendConfig
    attn: te
  # r0.6.0 builds Lightning's auxiliary MTP head natively; the pinned stack
  # dropped it at load and trained without it. Keep it out here too (the
  # checkpoint's mtp.* keys drop on the tolerant native load), so the two
  # stacks train the same parameters.
  num_nextn_predict_layers: 0
  mm_training_stage: 1
  mm_projector_ownership: module
  mm_projectors:
    - name: image
      kind: mlp2x_gelu
      mm_hidden_size: 768
  mm_placeholder_token_ids:
    image: 32

peft: null

# The projector is the complete trainable state; the package's artifact export
# (projector.artifact_dir) is the checkpoint. The frozen base needs none.
checkpoint:
  enabled: false
  checkpoint_dir: outputs/lightning-alignment/checkpoints

distributed:
  strategy: fsdp2
  tp_size: 1
  cp_size: 1
  pp_size: 1
  ep_size: 8
  sequence_parallel: false
  activation_checkpointing: false

# No freeze_config: the recipe's trainability seam (stage 1) sets requires_grad
# exactly — projector trainable, everything else frozen — and writes the
# manifest proving it.
loss_fn:
  _target_: nemo_automodel.components.loss.masked_ce.MaskedCrossEntropy

packed_sequence:
  packed_sequence_size: 2048
  packing_strategy: nemotron_stitch.automodel.data.StreamingFeaturePackingConfig
  packing_format: thd

dataset:
  _target_: nemotron_stitch.automodel.data.ManifestFeatureIterableDatasetConfig
  manifest_path: outputs/data/manifest.jsonl
  stage: alignment
  split: train
  cache_root: outputs/data/feature-cache
  projector_name: image
  placeholder_token_id: 32
  max_length: 512
  # The model answers directly (no think block); must match the GRPO prompt
  # rendering byte-for-byte.
  chat_template_kwargs: {enable_thinking: false}

dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  batch_size: null
  num_workers: 0
  shuffle: true
  shuffle_buffer_size: 1000

optimizer:
  _target_: nemotron_stitch.automodel.optim.ProjectorAdamWConfig
  lr: 3.0e-4
  weight_decay: 0.0
  betas: [0.9, 0.95]

wandb:
  mode: disabled

projector:
  model_registry_callback: llava_example.register_models
  train_projector: true
  artifact_dir: outputs/lightning-alignment/projector
  trainability_manifest: outputs/lightning-alignment/trainability.json
