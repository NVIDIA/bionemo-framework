[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nemotron-stitch-chemistry-example"
version = "0.1.0"
requires-python = ">=3.10"

[project.optional-dependencies]
preparation = ["rdkit==2025.9.1"]

[project.entry-points."vllm.general_plugins"]
stitch_chemistry = "chemistry_example:register_vllm"

[tool.setuptools]
py-modules = ["chemistry_example"]
