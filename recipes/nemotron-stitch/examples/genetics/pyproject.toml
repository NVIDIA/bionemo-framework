[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nemotron-stitch-genetics-example"
version = "0.1.0"
requires-python = ">=3.10"

[project.entry-points."vllm.general_plugins"]
stitch_genetics = "genetics_example:register_vllm"

[tool.setuptools]
py-modules = ["genetics_example"]
